[package]
name = "pan-shell"
version = "0.1.0"
description = "PAN Desktop Shell"
authors = ["the owner"]
edition = "2021"

[lib]
name = "pan_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
xcap = "0.0.14"
base64 = "0.22"
tiny_http = "0.12"
image = "0.25"
rdev = "0.5"
ureq = { version = "2", features = ["json"] }

# Windows-only: native WebView2 interop for granting getUserMedia (mic/cam/geo/sensors)
# via ICoreWebView2::add_PermissionRequested. Tauri 2's wry depends on webview2-com 0.38,
# so we pin to the same major to avoid duplicate type definitions.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61"
